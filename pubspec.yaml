name: anda_express
description: "Farm-Fresh Eggs & Chicken Every Day - Flutter + Firebase Mobile App."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase Core, Auth, Cloud Firestore & Cloud Messaging
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any
  firebase_storage: any

  # Camera Capture & Live GPS Tagging (Pinned to compatible versions)
  image_picker: any
  geolocator: 12.0.0

  # Watermark & Direct Cloudinary Upload
  image: any
  http: any

  # Utilities & Formatting
  intl: any
  url_launcher: any
  flutter_riverpod: any
  uuid: any
  cached_network_image: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#F7EEDD"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    
