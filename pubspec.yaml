name: anda_express
description: "Farm-Fresh Eggs & Chicken Every Day - Flutter + Firebase Mobile App."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase Core, Auth, Cloud Firestore & Cloud Messaging
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any
  firebase_storage: ^12.3.2

  # Camera Capture & Live GPS Tagging
  image_picker: any
  geolocator: any

  # Drawing Watermark on Photo & Direct Cloudinary Upload
  image: any
  http: any

  # Date Formatting & Instant Alerts (1-tap WhatsApp & phone calls)
  intl: any
  url_launcher: any

  # State Management & Utilities
  flutter_riverpod: ^2.6.1
  uuid: ^4.5.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    
