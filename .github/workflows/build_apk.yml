name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Recreate Android Project with Modern v2 Embedding
        run: |
          rm -rf android
          rm -f pubspec.lock
          flutter create . --platforms=android --project-name andaexpress_app --org com.andaexpress.app
          sed -i 's/android:label="andaexpress_app"/android:label="Anda Express"/g' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Generate App Icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndaExpress-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
