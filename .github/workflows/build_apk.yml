name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Clean and Recreate Android Structure
        run: |
          rm -rf android
          rm -f pubspec.lock
          flutter create . --platforms=android --project-name andaexpress_app --org com.andaexpress

      - name: Setup Global Gradle Init Script for SDK 35
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              ext.flutter = [
                  compileSdkVersion: 35,
                  minSdkVersion: 21,
                  targetSdkVersion: 35
              ]
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 35
                      }
                  }
              }
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndaExpress-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
