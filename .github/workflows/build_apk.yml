name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Clean and Recreate Android Structure
        run: |
          rm -rf android
          rm -f pubspec.lock
          flutter create . --platforms=android --project-name andaexpress_app --org com.andaexpress

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch Plugin Gradle Files Directly
        run: |
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/35/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/flutter.minSdkVersion/21/g' {} +
          find ~/.pub-cache/hosted/pub.dev/ -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/35/g' {} +
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 35/g' android/app/build.gradle || true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AndaExpress-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          
